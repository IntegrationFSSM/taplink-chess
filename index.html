<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Chess Club FSSM - Faculté des Sciences Semlalia Marrakech, Université Cadi Ayyad. Liens officiels, Instagram, Chess.com et contact." />
  <title>Chess Club FSSM — Faculté des Sciences Semlalia Marrakech</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="logo.jpg" />
  <link rel="apple-touch-icon" href="logo.jpg" />

  <!-- WhatsApp & Open Graph Preview -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Chess Club FSSM" />
  <meta property="og:url" content="https://integrationfssm.github.io/taplink-chess/" />
  <meta property="og:title" content="Chess Club FSSM — Liens Officiels" />
  <meta property="og:description" content="♟️ Club d'Échecs de la Faculté des Sciences Semlalia de Marrakech. Retrouvez tous nos liens : Instagram, Chess.com, WhatsApp et Email." />
  <meta property="og:image" content="https://integrationfssm.github.io/taplink-chess/og-image.jpg" />
  <meta property="og:image:secure_url" content="https://integrationfssm.github.io/taplink-chess/og-image.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="600" />
  <meta property="og:image:height" content="600" />
  <meta property="og:image:alt" content="Logo Chess Club FSSM" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Chess Club FSSM — Liens Officiels" />
  <meta name="twitter:description" content="♟️ Club d'Échecs de la Faculté des Sciences Semlalia de Marrakech." />
  <meta name="twitter:image" content="https://integrationfssm.github.io/taplink-chess/og-image.jpg" />

  <!-- Google Fonts & FontAwesome (comme cim-fullstack) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Background Image with Overlay (identique cim-fullstack) -->
  <div class="bg-slideshow-container" aria-hidden="true">
    <div class="bg-slide active" style="background-image: url('background.jpg');"></div>
  </div>
  <div class="bg-overlay" aria-hidden="true"></div>

  <!-- Main Shell Container (Linktree Centered Column) -->
  <main class="shell">
    
    <!-- Header with Enlarged Logo Card & Title -->
    <header class="header">
      <div class="logo-card">
        <img class="site-logo" src="logo.jpg" alt="Logo Chess Club FSSM" />
      </div>
      <div class="title-box">
        <h1 class="site-title">Chess Club FSSM</h1>
        <p class="site-subtitle">Faculté des Sciences Semlalia — Marrakech</p>
      </div>
    </header>

    <!-- Linktree Pill Buttons List (Vitrine épurée, les 4 liens) -->
    <nav class="links-list" aria-label="Liens officiels Chess Club FSSM">
      
      <!-- 1. Instagram -->
      <a href="https://www.instagram.com/chessclubfssm/" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="link-pill" 
         style="--hover-color: #e1306c;">
        <span class="pill-icon" style="color: #e1306c; border-color: #e1306c;">
          <i class="fa-brands fa-instagram"></i>
        </span>
        <div class="pill-content">
          <span class="pill-title">Instagram</span>
          <span class="pill-subtitle">@chessclubfssm</span>
        </div>
      </a>

      <!-- 2. Chess.com -->
      <a href="https://www.chess.com/club/chess-club-fssm" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="link-pill" 
         style="--hover-color: #7fa650;">
        <span class="pill-icon" style="color: #7fa650; border-color: #7fa650;">
          <i class="fa-solid fa-chess-pawn"></i>
        </span>
        <div class="pill-content">
          <span class="pill-title">Chess.com</span>
          <span class="pill-subtitle">Club officiel Chess Club FSSM</span>
        </div>
      </a>

      <!-- 3. WhatsApp -->
      <a href="https://chat.whatsapp.com/GMYdkeXZ9jcDqyYVKUwWLt" 
         target="_blank" 
         rel="noopener noreferrer" 
         class="link-pill" 
         style="--hover-color: #25d366;">
        <span class="pill-icon" style="color: #25d366; border-color: #25d366;">
          <i class="fa-brands fa-whatsapp"></i>
        </span>
        <div class="pill-content">
          <span class="pill-title">Groupe WhatsApp</span>
          <span class="pill-subtitle">Rejoindre la communauté</span>
        </div>
      </a>

      <!-- 4. Email -->
      <a href="mailto:chessclubfssm@gmail.com" 
         class="link-pill" 
         style="--hover-color: #ea4335;">
        <span class="pill-icon" style="color: #ea4335; border-color: #ea4335;">
          <i class="fa-solid fa-envelope"></i>
        </span>
        <div class="pill-content">
          <span class="pill-title">Email Officiel</span>
          <span class="pill-subtitle">chessclubfssm@gmail.com</span>
        </div>
      </a>

    </nav>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; <span id="year">2026</span> Chess Club FSSM — Faculté des Sciences Semlalia Marrakech. Tous droits réservés.</p>
    </footer>

  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
